name: Publiceer ELYRA Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Haal de projectbestanden op
        uses: actions/checkout@v4
      - name: Stel pnpm in
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false
      - name: Stel Node.js in
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Installeer pakketten
        run: pnpm install --frozen-lockfile
      - name: Bouw de statische website
        run: pnpm build
        env:
          NEXT_PUBLIC_BASE_PATH: /Elyra-Demo-Website
          NEXT_PUBLIC_SITE_URL: https://hannan1991.github.io/Elyra-Demo-Website
      - name: Stel GitHub Pages in
        uses: actions/configure-pages@v5
      - name: Upload websitebestanden
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publiceer op GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
